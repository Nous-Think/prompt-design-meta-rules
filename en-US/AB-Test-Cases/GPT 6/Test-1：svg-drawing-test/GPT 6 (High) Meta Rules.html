<footer><div class="caption">No hurry, just chasing a little sea breeze.<br><span>One pelican, one bicycle, and a just-right afternoon.</span></div><div class="controls"><button class="primary" id="toggle" type="button" aria-pressed="false">Ⅱ Pause</button><label class="speed" for="speed">Speed <input id="speed" type="range" min="0.4" max="2" value="1" step="0.1"><output id="speedValue" for="speed">1.0×</output></label><button id="bell" type="button" aria-label="Ring the bicycle bell">♫ Ring bell</button></div></footer>

<script>
'use strict';
// One shared clock keeps the pedals, wheels, and moving road synchronized.
const $=id=>document.getElementById(id);
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
let playing=!reducedMotion.matches, speed=1, time=0, previous=null, bellTime=-100;
function syncControls(){ $('toggle').textContent=playing?'Ⅱ Pause':'▶ Play';$('toggle').setAttribute('aria-pressed',String(!playing));$('status').textContent=playing?'Coastal lane · rolling easy':'Coastal lane · taking a breather'; }
function toggle(){playing=!playing;syncControls();}
$('toggle').addEventListener('click',toggle);
$('speed').addEventListener('input',e=>{speed=Number(e.target.value);$('speedValue').value=speed.toFixed(1)+'×';});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|BUTTON|TEXTAREA|SELECT/.test(e.target.tagName)){e.preventDefault();toggle();}});
reducedMotion.addEventListener('change',e=>{if(e.matches){playing=false;syncControls();}});
let audioContext;
$('bell').addEventListener('click',()=>{bellTime=performance.now()/1000;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;audioContext??=new Audio();audioContext.resume().catch(()=>{});const now=audioContext.currentTime;[0,.14].forEach((offset)=>{[1480,2220].forEach((frequency,i)=>{const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type='sine';osc.frequency.value=frequency;gain.gain.setValueAtTime(.0001,now+offset);gain.gain.exponentialRampToValueAtTime(i?.025:.09,now+offset+.006);gain.gain.exponentialRampToValueAtTime(.0001,now+offset+.7);osc.connect(gain);gain.connect(audioContext.destination);osc.start(now+offset);osc.stop(now+offset+.72);});});}catch{/* A visual bell response remains available without audio. */}});
// Two-link inverse kinematics keeps each webbed foot attached to its pedal.
function leg(angle,near){const px=550+25*Math.cos(angle),py=510+25*Math.sin(angle),hx=near?509:520,hy=near?383:382;const dx=px-hx,dy=py-hy,d=Math.hypot(dx,dy),upper=88,lower=86;const a=(upper*upper-lower*lower+d*d)/(2*d),h=Math.sqrt(Math.max(0,upper*upper-a*a));const kx=hx+a*dx/d+h*dy/d,ky=hy+a*dy/d-h*dx/d;const path=`M${hx} ${hy}L${kx} ${ky}L${px} ${py-5}`;$(near?'nearLeg':'farLeg').setAttribute('d',path);if(near)$('nearLegColor').setAttribute('d',path);$(near?'nearFoot':'farFoot').setAttribute('d',`M${px-6} ${py-8}Q${px+3} ${py-12} ${px+10} ${py-5}L${px+24} ${py+1}L${px+11} ${py+5}L${px+3} ${py+2}L${px-7} ${py+3}Z`);if(near)$('nearPedal').setAttribute('d',`M${px-10} ${py+7}H${px+23}`);}
function render(stamp){if(previous===null)previous=stamp;const dt=Math.min((stamp-previous)/1000,.05);previous=stamp;if(playing&&!document.hidden)time+=dt*speed;const angle=time*3.3;const distance=angle*78*1.65;const degrees=angle*1.65*180/Math.PI;
 $('rearWheel').setAttribute('transform',`rotate(${degrees%360})`);$('frontWheel').setAttribute('transform',`rotate(${degrees%360})`);$('crank').setAttribute('transform',`rotate(${angle*180/Math.PI%360} 550 510)`);leg(angle,true);leg(angle+Math.PI,false);
 $('road').setAttribute('transform',`translate(${-distance%1280} 0)`);$('shore').setAttribute('transform',`translate(${-(distance*.48)%1200} 0)`);$('clouds').setAttribute('transform',`translate(${Math.sin(time*.06)*25} 0)`);$('waves').setAttribute('transform',`translate(${Math.sin(time*.3)*12} 0)`);$('distantBirds').setAttribute('transform',`translate(${Math.sin(time*.14)*17} ${Math.sin(time*.7)*3})`);
 const flap=Math.sin(time*6)*6;$('scarfTail').setAttribute('d',`M563 269Q527 ${254+flap} 505 ${265+flap}L477 ${251+flap*1.4}L485 ${272+flap}Q523 ${293+flap} 563 281Z`);
 const bellAge=stamp/1000-bellTime;$('bellRings').setAttribute('opacity',bellAge<.9?String(Math.max(0,1-bellAge/.9)):0);
 requestAnimationFrame(render);}
syncControls();requestAnimationFrame(render);
</script>
