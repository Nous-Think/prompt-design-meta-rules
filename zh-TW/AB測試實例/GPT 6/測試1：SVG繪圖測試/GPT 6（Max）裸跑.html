  <style>
    :root { color-scheme: light; --ink:#233f43; --paper:#f8f5ed; --muted:#617572; --accent:#276960; }
    * { box-sizing: border-box; }
    body { margin:0; min-width:280px; min-height:100svh; background:var(--paper); color:var(--ink); font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; }
    main { width:min(1360px,100%); margin:auto; padding:30px 44px 22px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:21px; }
    .title-lockup { display:flex; align-items:center; gap:13px; }
    .brand-mark { width:36px; height:36px; flex:none; }
    h1 { margin:0; font-family:"Noto Serif TC","Songti TC",serif; font-size:25px; font-weight:700; letter-spacing:.13em; }
    .caption { margin:0; font-size:14px; color:var(--muted); letter-spacing:.09em; }
    .scene-wrap { position:relative; overflow:hidden; border-radius:10px; background:#dfede7; border:1px solid #233f4320; }
    #scene { display:block; width:100%; height:auto; aspect-ratio:1200/760; }
    .control-bar { display:flex; align-items:center; justify-content:space-between; gap:24px; padding:19px 2px 0; }
    .playback { display:flex; align-items:center; gap:20px; }
    button { font:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
    button:focus-visible { outline:3px solid #d66f48; outline-offset:4px; }
    .play-toggle { display:flex; align-items:center; justify-content:center; gap:9px; min-width:104px; height:44px; padding:0 19px; border:0; border-radius:24px; background:var(--ink); color:var(--paper); font-size:14px; letter-spacing:.1em; }
    .play-toggle:hover { background:#32615e; }
    .play-toggle svg { width:15px; height:15px; fill:currentColor; }
    .speeds { display:flex; align-items:center; gap:3px; padding:3px; border:1px solid #233f4322; border-radius:25px; }
    .speed { border:0; padding:0 13px; height:36px; min-width:44px; border-radius:20px; background:transparent; color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums; }
    .speed:hover { background:#e8eade; }
    .speed[aria-pressed="true"] { background:#e0e8dc; color:var(--ink); font-weight:700; }
    .hint { font-size:13px; color:#6e7c73; letter-spacing:.04em; }
    kbd { display:inline-block; padding:2px 6px; margin-right:4px; border:1px solid #233f4325; border-radius:4px; font:inherit; font-size:12px; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    noscript p { padding:12px; text-align:center; font-size:14px; }
    @media (min-width:1500px) { main { padding-top:44px; } }
    @media (max-width:700px) {
      main { padding:23px 16px 22px; }
      header { align-items:flex-start; margin-bottom:18px; }
      h1 { font-size:22px; }
      .brand-mark { width:30px; height:30px; }
      .caption { font-size:12px; letter-spacing:0; padding-top:8px; }
      #scene { aspect-ratio:4/4.1; }
      .scene-wrap { border-radius:7px; }
      .control-bar { justify-content:center; padding-top:18px; }
      .hint { display:none; }
      .playback { gap:14px; }
      .speed { padding-inline:12px; }
    }
    @media (max-width:370px) { .caption { display:none; } .title-lockup { gap:9px; } .playback { gap:9px; } }
  </style>
</head>

        <!-- The scarf's control points move; the knot remains on the neck. -->
        <path id="scarf-tail-back" d="M608 321C578 317 550 307 521 318L534 328L524 339C556 326 581 341 614 333Z" fill="#b8543e" stroke="#874938" stroke-width="2"/>
        <path id="scarf-tail" d="M613 319C580 322 552 340 522 329L507 338L522 348C554 358 588 334 618 333Z" fill="#dc7856" stroke="#8e503c" stroke-width="2"/>
        <path d="M609 314Q628 323 647 315L648 331Q629 339 609 330Z" fill="#dd7855" stroke="#8e503c" stroke-width="2.3"/>
        <path d="M614 319Q629 325 642 322" fill="none" stroke="#f3a071" stroke-width="2.2"/>
        <path d="M607 319Q600 322 607 333Q616 335 617 327Q618 320 607 319Z" fill="#ec9063" stroke="#8e503c" stroke-width="2"/>
        <path d="M485 387Q495 379 505 383M486 400Q498 393 508 397" fill="none" stroke="#b1c0b0" stroke-width="2"/>
      </g>
      <!-- The wing connects the gently bobbing shoulder to the fixed handlebar. -->
      <path id="holding-wing" d="M511 366C542 346 585 350 614 369C641 389 674 391 707 384Q719 383 721 390Q720 402 707 404C669 416 635 411 605 402C576 412 531 415 511 396Q501 383 511 366Z" fill="#f2f0df" stroke="#355956" stroke-width="2.7"/>
      <path id="wing-feathers" d="M526 379Q552 395 583 388M525 389Q552 403 579 397M611 383Q641 402 683 396" fill="none" stroke="#bac7b5" stroke-width="2.2"/>
      <path d="M709 388L715 395M704 390L710 398" fill="none" stroke="#899d8b" stroke-width="1.8"/>
    </g>

    <g id="foreground"><use href="#foreground-strip"/><use href="#foreground-strip" x="1800"/></g>
    <!-- Static grain is clipped to the illustration and requires no assets. -->
    <rect width="1200" height="760" filter="url(#paper-texture)" opacity=".055" style="mix-blend-mode:multiply;pointer-events:none"/>
  </svg>
  </div>
  <div class="control-bar">
    <div class="playback">
      <button class="play-toggle" id="play-toggle" type="button" aria-label="暫停動畫" aria-controls="scene">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path id="play-icon" d="M3 2h3v12H3zM10 2h3v12h-3z"/></svg><span id="play-label">暫停</span>
      </button>
      <div class="speeds" role="group" aria-label="播放速度">
        <button class="speed" type="button" data-speed="0.5" aria-label="半速播放" aria-pressed="false">0.5×</button>
        <button class="speed" type="button" data-speed="1" aria-label="正常速度播放" aria-pressed="true">1×</button>
        <button class="speed" type="button" data-speed="1.5" aria-label="一點五倍速播放" aria-pressed="false">1.5×</button>
      </div>
    </div>
    <span class="hint"><kbd>空白鍵</kbd> 暫停，看看海</span>
  </div>
  <p class="sr-only" id="playback-status" role="status" aria-live="polite"></p>
  <noscript><p>請啟用 JavaScript 以播放動畫；目前顯示靜態插畫。</p></noscript>
</main>
<script>
(() => {
  'use strict';
  // Everything is inline: this file works from file:// with no connection.
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2;
  const WHEEL_RADIUS = 93;
  const CHAINRING_RADIUS = 34;
  const REAR_SPROCKET_RADIUS = 14;
  const GEAR_RATIO = CHAINRING_RADIUS / REAR_SPROCKET_RADIUS;
  const CRANK_RADIUS = 34;
  const CADENCE = TAU / 3.2;
  const INITIAL_PHASE = -Math.PI / 5;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const mobile = window.matchMedia('(max-width: 700px)');
  const parts = {};
  ['rear-spokes','front-spokes','chainring','cranks','near-leg','near-leg-light','far-leg','far-leg-light','near-foot','far-foot','pelican','holding-wing','wing-feathers','eye','scarf-tail','scarf-tail-back','clouds','islands','shore','foreground','road-marks','road-grain','water-lines','sailboat','birds','bird-a','bird-b','bird-c','sun-glitter','surf','chain-links'].forEach(id => parts[id] = $(id));
  let elapsed = 0;
  let speed = 1;
  let playing = !reducedMotion.matches;
  let frame = 0;
  let lastTimestamp = null;

  const n = v => Number(v.toFixed(3));
  const attr = (id, key, value) => parts[id].setAttribute(key, value);
  const translate = (id, x, y=0) => attr(id, 'transform', `translate(${n(x)} ${n(y)})`);
  const rotate = (id, a) => attr(id, 'transform', `rotate(${n(a)})`);
  const point = p => `${n(p.x)} ${n(p.y)}`;

  // Exact tangent construction prevents the chain from crossing the hubs.
  function chainOutline() {
    const a = {x:420, y:583}, b = {x:576, y:554};
    const dx = b.x-a.x, dy = b.y-a.y, distance = Math.hypot(dx,dy);
    const angle = Math.atan2(dy,dx);
    const tangentAngle = Math.acos((REAR_SPROCKET_RADIUS-CHAINRING_RADIUS)/distance);
    const offset = (c,r,theta) => ({x:c.x+r*Math.cos(theta), y:c.y+r*Math.sin(theta)});
    const upperA = offset(a,REAR_SPROCKET_RADIUS,angle-tangentAngle);
    const upperB = offset(b,CHAINRING_RADIUS,angle-tangentAngle);
    const lowerB = offset(b,CHAINRING_RADIUS,angle+tangentAngle);
    const lowerA = offset(a,REAR_SPROCKET_RADIUS,angle+tangentAngle);
    const d = `M${point(upperA)}L${point(upperB)}A34 34 0 1 1 ${point(lowerB)}L${point(lowerA)}A14 14 0 0 1 ${point(upperA)}Z`;
    $('chain').setAttribute('d',d);
    $('chain-links').setAttribute('d',d);
  }

  // Two fixed-length bones meet at a forward-facing knee. Pedals stay level.
  function leg(prefix, hip, pedal, thigh, shin) {
    const ankle = {x:pedal.x-2, y:pedal.y-13};
    const dx = ankle.x-hip.x, dy = ankle.y-hip.y;
    const distance = Math.hypot(dx,dy);
    const along = (thigh*thigh-shin*shin+distance*distance)/(2*distance);
    const height = Math.sqrt(Math.max(0,thigh*thigh-along*along));
    const knee = {x:hip.x+dx/distance*along+dy/distance*height,
                  y:hip.y+dy/distance*along-dx/distance*height};
    const d = `M${point(hip)}L${point(knee)}L${point(ankle)}`;
    attr(`${prefix}-leg`,'d',d);
    attr(`${prefix}-leg-light`,'d',d);
    translate(`${prefix}-foot`,pedal.x,pedal.y);
  }

  function render(time) {
    const phase = INITIAL_PHASE + time*CADENCE;
    const crankDegrees = (phase*180/Math.PI)%360;
    const wheelRadians = time*CADENCE*GEAR_RATIO;
    const wheelDegrees = (wheelRadians*180/Math.PI)%360;
    const travel = wheelRadians*WHEEL_RADIUS;
    const bob = Math.sin(phase*2)*2;
    const pedal = {x:576+Math.cos(phase)*CRANK_RADIUS, y:554+Math.sin(phase)*CRANK_RADIUS};
    const opposite = {x:1152-pedal.x, y:1108-pedal.y};

    rotate('rear-spokes',wheelDegrees);
    rotate('front-spokes',wheelDegrees);
    rotate('chainring',crankDegrees);
    rotate('cranks',crankDegrees);
    // The visible upper chain travels toward the front chainring.
    attr('chain-links','stroke-dashoffset',n(-(time*CADENCE*CHAINRING_RADIUS)%7));
    leg('far',{x:530,y:426+bob},opposite,82,88);
    leg('near',{x:556,y:429+bob},pedal,82,88);
    translate('pelican',0,bob);

    // Shoulder follows the torso; the wing tip holds the handlebar in place.
    attr('holding-wing','d',`M511 ${n(366+bob)}C542 ${n(346+bob)} 585 ${n(350+bob)} 614 ${n(369+bob)}C641 ${n(389+bob*.5)} 674 391 707 384Q719 383 721 390Q720 402 707 404C669 416 635 ${n(411+bob*.5)} 605 ${n(402+bob)}C576 ${n(412+bob)} 531 ${n(415+bob)} 511 ${n(396+bob)}Q501 ${n(383+bob)} 511 ${n(366+bob)}Z`);
    attr('wing-feathers','d',`M526 ${n(379+bob)}Q552 ${n(395+bob)} 583 ${n(388+bob)}M525 ${n(389+bob)}Q552 ${n(403+bob)} 579 ${n(397+bob)}M611 ${n(383+bob)}Q641 ${n(402+bob*.5)} 683 396`);

    const flutter = Math.sin(time*4.5)*7;
    const flutter2 = Math.sin(time*4.5-1.2)*5;
    attr('scarf-tail-back','d',`M608 321C578 ${n(317+flutter2)} 550 ${n(307+flutter)} 521 ${n(318+flutter)}L534 ${n(328+flutter)}L524 ${n(339+flutter)}C556 ${n(326+flutter2)} 581 341 614 333Z`);
    attr('scarf-tail','d',`M613 319C580 ${n(322+flutter2)} 552 ${n(340+flutter)} 522 ${n(329+flutter)}L507 ${n(338+flutter)}L522 ${n(348+flutter)}C554 ${n(358+flutter)} 588 334 618 333Z`);
    const blinkPhase = time%5.7;
    const blink = blinkPhase>4.96 && blinkPhase<5.18 ? 1-.94*Math.sin((blinkPhase-4.96)/.22*Math.PI) : 1;
    attr('eye','transform',`translate(650 219) scale(1 ${n(blink)})`);

    translate('clouds',-(travel*.019)%1800);
    translate('islands',-(travel*.037)%1800);
    translate('shore',-(travel*.76)%1800);
    translate('foreground',-(travel*1.12)%1800);
    attr('road-marks','patternTransform',`translate(${n(-travel%210)} 0)`);
    attr('road-grain','patternTransform',`translate(${n(-travel%210)} 0)`);
    attr('water-lines','patternTransform',`translate(${n(-(travel*.13)%340)} ${n(Math.sin(time*.7)*1.8)})`);
    const boatX = ((284-travel*.055+150)%1450+1450)%1450-150;
    attr('sailboat','transform',`translate(${n(boatX)} ${n(389+Math.sin(time*1.7)*2)}) rotate(${n(Math.sin(time*1.2)*2)})`);
    const birdsX = ((-travel*.045+450)%1600+1600)%1600-450;
    translate('birds',birdsX,Math.sin(time*.6)*7);
    const flap = Math.sin(time*2.8)*4;
    attr('bird-a','d',`M252 217q12 ${n(-13+flap)} 25 0q12 ${n(-13+flap)} 25 0`);
    attr('bird-b','d',`M311 195q9 ${n(-9-flap*.7)} 18 0q9 ${n(-9-flap*.7)} 18 0`);
    attr('bird-c','d',`M208 238q7 ${n(-7+flap*.5)} 14 0q7 ${n(-7+flap*.5)} 14 0`);
    attr('sun-glitter','opacity',n(.58+Math.sin(time*1.1)*.12));
    attr('surf','transform',`translate(0 ${n(Math.sin(time*.75)*2.7)})`);
  }

  function tick(timestamp) {
    if (!playing || document.hidden) { frame=0; lastTimestamp=null; return; }
    if (lastTimestamp!==null) elapsed += Math.min((timestamp-lastTimestamp)/1000,.05)*speed;
    lastTimestamp=timestamp;
    render(elapsed);
    frame=requestAnimationFrame(tick);
  }
  function schedule() {
    if (playing && !document.hidden && !frame) { lastTimestamp=null; frame=requestAnimationFrame(tick); }
  }
  function updateControls(announce=false) {
    $('play-icon').setAttribute('d',playing?'M3 2h3v12H3zM10 2h3v12h-3z':'M4 2L14 8L4 14Z');
    $('play-label').textContent=playing?'暫停':'播放';
    $('play-toggle').setAttribute('aria-label',playing?'暫停動畫':'播放動畫');
    if (announce) $('playback-status').textContent=playing?'動畫播放中':'動畫已暫停';
  }
  function togglePlayback() {
    playing=!playing;
    if (!playing) { cancelAnimationFrame(frame); frame=0; lastTimestamp=null; }
    updateControls(true);
    schedule();
  }
  $('play-toggle').addEventListener('click',togglePlayback);
  document.querySelectorAll('[data-speed]').forEach(button => {
    button.addEventListener('click',() => {
      speed=Number(button.dataset.speed);
      document.querySelectorAll('[data-speed]').forEach(other => other.setAttribute('aria-pressed',String(other===button)));
      $('playback-status').textContent=`播放速度 ${speed} 倍`;
    });
  });
  document.addEventListener('keydown',event => {
    const target=event.target;
    if (event.code==='Space' && !event.repeat && !event.altKey && !event.ctrlKey && !event.metaKey && !target.closest('button,input,select,textarea,[contenteditable="true"]')) {
      event.preventDefault(); togglePlayback();
    }
  });
  document.addEventListener('visibilitychange',() => {
    if (document.hidden) { cancelAnimationFrame(frame); frame=0; lastTimestamp=null; }
    else schedule();
  });
  reducedMotion.addEventListener('change',event => {
    if (event.matches && playing) togglePlayback();
  });
  function fitScene() {
    // On small screens reframe the drawing instead of shrinking the character.
    $('scene').setAttribute('viewBox',mobile.matches?'300 70 630 646':'0 0 1200 760');
  }
  mobile.addEventListener('change',fitScene);
  chainOutline();
  fitScene();
  render(0);
  updateControls();
  schedule();
})();
</script>
</body>
