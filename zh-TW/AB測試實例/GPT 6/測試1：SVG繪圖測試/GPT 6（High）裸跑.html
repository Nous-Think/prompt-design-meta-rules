<footer><span class="caption">一路向海，讓風帶路。</span><div class="controls"><button id="toggle" type="button" aria-label="暫停動畫">暫停</button><label for="speed">速度 <input id="speed" type="range" min="0.5" max="2" value="1" step="0.25"><output id="speedValue" for="speed">1×</output></label></div></footer>

<script>
(() => {
 'use strict';
 const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
 const add=(parent,tag,attrs)=>{const el=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);$(parent).appendChild(el);return el;};
 for(let i=0;i<32;i++){const x=i*135;add('waves','path',{d:`M${x} ${447+(i%4)*23}h${35+(i%3)*25}`});}
 for(let i=0;i<14;i++)add('road','path',{d:`M${i*140} 644h60`});
 for(let i=0;i<12;i++){add('plants','use',{href:'#grass',transform:`translate(${i*185} ${583-(i%3)*5}) scale(.65)`});}
 for(let i=0;i<16;i++){add('foreground','use',{href:i%3===0?'#flower':'#grass',transform:`translate(${i*170+45} ${759+(i%2)*12}) scale(${i%3===0?1:0.8})`});}
 const state={t:0,last:null,speed:1,playing:!matchMedia('(prefers-reduced-motion: reduce)').matches};
 function button(){ $('toggle').textContent=state.playing?'暫停':'播放';$('toggle').setAttribute('aria-label',state.playing?'暫停動畫':'播放動畫'); }
 $('toggle').addEventListener('click',()=>{state.playing=!state.playing;button();});
 $('speed').addEventListener('input',e=>{state.speed=Number(e.target.value);$('speedValue').textContent=`${state.speed}×`;});
 document.addEventListener('visibilitychange',()=>{state.last=null;});
 function leg(side,phase,bob){
  const x=570+31*Math.cos(phase),y=564+31*Math.sin(phase), hx=side==='near'?549:537,hy=424+bob;
  // Two-bone inverse kinematics: each foot stays attached to its pedal.
  const dx=x-hx,dy=y-8-hy,d=Math.hypot(dx,dy),a=79,b=88;
  const along=(a*a-b*b+d*d)/(2*d),height=Math.sqrt(Math.max(0,a*a-along*along));
  const kx=hx+dx*along/d+dy*height/d,ky=hy+dy*along/d-dx*height/d;
  const path=`M${hx} ${hy}L${kx} ${ky}L${x} ${y-8}`;
  $(side+'Leg').setAttribute('d',path);
  if(side==='near')$('nearLegLight').setAttribute('d',path);
  $(side+'Crank').setAttribute('d',`M570 564L${x} ${y}`);
  $(side+'Pedal').setAttribute('d',`M${x-13} ${y}h26`);
  $(side+'Foot').setAttribute('d',side==='near'?`M${x-11} ${y-11}q16-6 33 0l-3 8h-28Z`:`M${x-7} ${y-7}h24`);
 }
 function draw(){
  const t=state.t,phase=t*3.2,bob=Math.sin(phase*2)*1.8,dist=t*145;
  $('rearSpokes').setAttribute('transform',`rotate(${dist/88*180/Math.PI})`);
  $('frontSpokes').setAttribute('transform',`rotate(${dist/88*180/Math.PI})`);
  $('bird').setAttribute('transform',`translate(0 ${bob})`);
  $('scarfTail').setAttribute('transform',`rotate(${Math.sin(t*7)*5} 607 303)`);
  const blink=t%5.7; $('eye').setAttribute('transform',`translate(0 239) scale(1 ${blink>5.48?Math.max(.08,Math.abs(blink-5.59)/.11):1}) translate(0 -239)`);
  leg('far',phase+Math.PI,bob);leg('near',phase,bob);
  $('clouds').setAttribute('transform',`translate(${-t*9%1200} 0)`);
  $('hills').setAttribute('transform',`translate(${-t*15%1200} 0)`);
  $('waves').setAttribute('transform',`translate(${-t*30%1620} 0)`);
  $('road').setAttribute('transform',`translate(${-dist%140} 0)`);
  $('plants').setAttribute('transform',`translate(${-dist%555} 0)`);
  $('foreground').setAttribute('transform',`translate(${-dist*1.15%1020} 0)`);
 }
 function frame(now){if(state.last!==null&&state.playing&&!document.hidden)state.t+=Math.min((now-state.last)/1000,.05)*state.speed;state.last=now;draw();requestAnimationFrame(frame);}
 button();draw();requestAnimationFrame(frame);
})();
</script>
