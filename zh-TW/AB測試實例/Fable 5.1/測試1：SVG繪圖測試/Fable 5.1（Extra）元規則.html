<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fable 5.1（Extra）元規則：鵜鶘騎自行車</title>
<style>
  :root {
    --page: #1d3242;
    --page-text: #e6eef3;
    --page-muted: #9fb3c1;
    --control-bg: rgba(255,255,255,0.08);
    --control-border: rgba(255,255,255,0.18);
    --focus: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--page);
    color: var(--page-text);
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Hiragino Sans", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 28px 16px 36px;
    gap: 14px;
  }
  .wrap { width: min(100%, 960px); display: flex; flex-direction: column; gap: 14px; }
  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  h1 small { color: var(--page-muted); font-weight: 400; font-size: 14px; margin-left: 10px; }
  .stage {
    margin: 0;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    overflow: hidden;
    background: #a6d5ee;
    box-shadow: 0 18px 50px rgba(0,0,0,0.35);
    cursor: pointer;
  }
  .stage:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  svg { width: 100%; height: 100%; display: block; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 18px;
    font-size: 14px;
  }
  button {
    font: inherit;
    color: var(--page-text);
    background: var(--control-bg);
    border: 1px solid var(--control-border);
    border-radius: 999px;
    padding: 7px 16px;
    cursor: pointer;
    min-width: 96px;
  }
  button:hover { background: rgba(255,255,255,0.14); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  label { display: inline-flex; align-items: center; gap: 10px; }
  input[type="range"] { width: 160px; accent-color: #ffd166; }
  .val { min-width: 3.5em; font-variant-numeric: tabular-nums; }
  .hint { color: var(--page-muted); }
  @media (max-width: 520px) {
    h1 small { display: block; margin: 4px 0 0; }
    input[type="range"] { width: 120px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>鵜鶘騎自行車<small>純 SVG 繪製的 2D 動畫</small></h1>

  <figure class="stage" id="stage" tabindex="0" aria-label="一隻鵜鶘沿著海邊公路騎自行車的動畫，點擊可暫停或繼續">
  <svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8fc7e8"/>
        <stop offset="0.7" stop-color="#cfe8f6"/>
        <stop offset="1" stop-color="#eaf5fb"/>
      </linearGradient>
      <radialGradient id="sun">
        <stop offset="0" stop-color="#fff9d6"/>

      </linearGradient>
      <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6c737a"/>

      <!-- Wheel: centred on origin so it can be rotated in place -->

        <ellipse cx="26" cy="5" rx="21" ry="11"/>
        <ellipse cx="4" cy="-9" rx="18" ry="12"/>

      <g id="tree">

        <circle cx="0" cy="-20" r="10" fill="#6fa25f"/>
        <circle cx="-7" cy="-14" r="7" fill="#5f9350"/>
        <circle cx="7" cy="-15" r="7" fill="#7cae6b"/>

        <path d="M0 0 q0 -9 1 -14"/>
        <path d="M0 0 q3 -7 7 -9"/>

      <!-- Webbed foot; ankle sits at local (0,-3), sole at local y ≈ 5 -->
      <path id="foot" d="M-8 -4 C-11 0 -9 4 -5 5 L10 6 L17 5 L12 3 L19 0 L12 0 L17 -5 L8 -2 C4 -3 0 -4 -8 -4 Z"
            fill="#ef8140" stroke="#c9622a" stroke-width="1" stroke-linejoin="round"/>
      <rect id="pedal" x="-9" y="-2.5" width="18" height="5" rx="1.5" fill="#2b2b2b"/>
    </defs>

    <!-- Sky and sun -->
    <rect width="800" height="450" fill="url(#sky)"/>
    <circle cx="660" cy="92" r="70" fill="url(#sun)"/>

    <!-- Far clouds (slowest layer) -->
    <g id="cloudsFar" opacity="0.85">
      <g id="cf">
        <use xlink:href="#cloud" transform="translate(120 72) scale(0.8)"/>
        <use xlink:href="#cloud" transform="translate(390 52)"/>
        <use xlink:href="#cloud" transform="translate(560 128) scale(0.65)"/>
      </g>

    <!-- Far hills -->
    <g id="hillsFar">
      <g id="hf">
        <path d="M0 335 L0 290 Q80 230 170 285 Q250 245 330 290 Q420 235 510 288 Q590 250 670 292 Q740 262 800 290 L800 335 Z" fill="#c3d8b3"/>
      </g>

    <!-- Near clouds -->

    <!-- Mid hills with trees -->

      </g>

        <use xlink:href="#tree" transform="translate(520 333)"/>
        <use xlink:href="#tree" transform="translate(700 332) scale(1.2)"/>
      </g>
      <use xlink:href="#tr" x="800"/>
    </g>

    <!-- Grass verge -->
    <rect x="0" y="330" width="800" height="50" fill="#8dbd6f"/>
    <rect x="0" y="371" width="800" height="7" fill="#7aa85e"/>
    <g id="verge">
      <g id="vg">
        <use xlink:href="#tuft" x="40" y="368"/>
        <use xlink:href="#tuft" x="132" y="362"/>
        <circle cx="140" cy="352" r="2.6" fill="#f6c945"/>
        <use xlink:href="#tuft" x="215" y="370"/>
        <use xlink:href="#tuft" x="330" y="360"/>
        <circle cx="323" cy="350" r="2.6" fill="#f08ba0"/>
        <use xlink:href="#tuft" x="470" y="366"/>
        <use xlink:href="#tuft" x="560" y="358"/>
        <circle cx="567" cy="349" r="2.6" fill="#f6c945"/>
        <use xlink:href="#tuft" x="690" y="369"/>
        <use xlink:href="#tuft" x="760" y="361"/>
      </g>
      <use xlink:href="#vg" x="800"/>
    </g>

    <!-- Road -->
    <rect x="0" y="376" width="800" height="74" fill="url(#road)"/>
    <rect x="0" y="376" width="800" height="3" fill="#9aa1a8"/>
    <line id="roadDash" x1="0" y1="416" x2="800" y2="416" stroke="#f2e0a2" stroke-width="4" stroke-dasharray="38 26"/>

    <!-- Ground shadow -->
    <ellipse cx="342" cy="382" rx="150" ry="5" fill="#000" opacity="0.16"/>

    <!-- ===== Far side of the bicycle (behind the frame) ===== -->
    <use id="pedalFar" xlink:href="#pedal" transform="translate(290 336)"/>
    <use id="footFar" xlink:href="#foot" transform="translate(288 328.5)"/>
    <path id="thighFarO" d="M304 214 L340 262" stroke="#d9d0c2" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path id="thighFar" d="M304 214 L340 262" stroke="#f3eee4" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path id="shinFar" d="M340 262 L288 325.5" stroke="#d9702f" stroke-width="6" stroke-linecap="round" fill="none"/>
    <g id="crankFar" transform="translate(320 336)">
      <line x1="0" y1="0" x2="-30" y2="0" stroke="#3a3a3a" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- ===== Bicycle ===== -->
    <use id="rearWheel" xlink:href="#wheel" transform="translate(250 325)"/>
    <use id="frontWheel" xlink:href="#wheel" transform="translate(430 325)"/>
    <circle cx="250" cy="325" r="14" fill="#3a3a3a"/>
    <circle cx="250" cy="325" r="15.5" fill="none" stroke="#3a3a3a" stroke-width="2.5" stroke-dasharray="2 2"/>

    <g stroke="#1f6f8b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M296 238 L408 222"/>            <!-- top tube -->
      <path d="M320 336 L296 238"/>            <!-- seat tube -->
      <path d="M417 252 L320 336"/>            <!-- down tube -->
      <path d="M320 336 L250 325"/>            <!-- chainstay -->
      <path d="M296 238 L250 325"/>            <!-- seat stay -->
      <path d="M408 222 L417 252" stroke-width="8"/> <!-- head tube -->
      <path d="M417 252 Q426 288 430 325" stroke-width="5"/> <!-- fork -->
    </g>
    <line x1="296" y1="238" x2="291" y2="220" stroke="#9aa0a6" stroke-width="4" stroke-linecap="round"/>  <!-- seat post -->
    <line x1="408" y1="222" x2="404" y2="206" stroke="#9aa0a6" stroke-width="4" stroke-linecap="round"/>  <!-- stem -->
    <path d="M388 212 Q404 200 421 206" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round" fill="none"/> <!-- handlebar -->
    <path d="M268 221 Q292 208 314 219 Q292 228 268 225 Z" fill="#3b2f2f"/> <!-- saddle -->

    <!-- Chain -->
    <path id="chainTop" d="M250 311 L320 316" stroke="#454545" stroke-width="3" fill="none" stroke-dasharray="4 3"/>
    <path id="chainBottom" d="M320 356 L250 339" stroke="#454545" stroke-width="3" fill="none" stroke-dasharray="4 3"/>

    <!-- Near crank and chainring -->
    <g id="crankNear" transform="translate(320 336)">
      <circle r="20" fill="#2f2f2f"/>
      <circle r="22.5" fill="none" stroke="#2f2f2f" stroke-width="3" stroke-dasharray="2.5 2.4"/>
      <circle r="9" fill="#555"/>
      <line x1="0" y1="0" x2="30" y2="0" stroke="#3a3a3a" stroke-width="5" stroke-linecap="round"/>
      <circle r="2.5" fill="#8a8a8a"/>
    </g>
    <use id="pedalNear" xlink:href="#pedal" transform="translate(350 336)"/>

    <!-- Near leg -->
    <path id="thighNearO" d="M312 214 L370 244" stroke="#d9d0c2" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path id="thighNear" d="M312 214 L370 244" stroke="#fbf8f1" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path id="shinNear" d="M370 244 L348 325.5" stroke="#ef8140" stroke-width="6" stroke-linecap="round" fill="none"/>
    <use id="footNear" xlink:href="#foot" transform="translate(348 328.5)"/>

    <!-- ===== Pelican ===== -->
    <g id="riderBody">
      <path d="M250 176 L224 178 L232 186 L219 194 L233 196 L226 206 L250 200 Z" fill="#ece5d7" stroke="#d9d0c2" stroke-width="1.5" stroke-linejoin="round"/> <!-- tail -->
      <ellipse cx="300" cy="182" rx="58" ry="36" transform="rotate(-8 300 182)" fill="url(#feather)" stroke="#d9d0c2" stroke-width="2"/>
      <path d="M262 200 Q300 224 340 198" stroke="#e6ded0" stroke-width="2" fill="none" opacity="0.8"/> <!-- belly shading -->
    </g>

    <g id="neckHead">
      <path id="neckO" d="M328 156 C352 150 350 122 372 108 C384 100 392 98 398 99" stroke="#d9d0c2" stroke-width="27" stroke-linecap="round" fill="none"/>
      <path d="M328 156 C352 150 350 122 372 108 C384 100 392 98 398 99" stroke="#fbf8f1" stroke-width="22" stroke-linecap="round" fill="none"/>
      <circle cx="400" cy="99" r="21" fill="#fbf8f1" stroke="#d9d0c2" stroke-width="2"/>
      <path d="M384 84 C375 82 370 74 373 66 C377 72 385 76 391 79 Z" fill="#fbf8f1" stroke="#d9d0c2" stroke-width="1.5" stroke-linejoin="round"/> <!-- nape tuft -->
      <path id="pouch" d="M412 104 Q448 152 489 119 Z" fill="url(#pouch)" stroke="#d4744f" stroke-width="1"/>
      <path d="M411 92 C440 94 470 104 494 116 L492 122 L489 119 C465 112 438 105 412 104 Z" fill="#f4b942" stroke="#d99a2a" stroke-width="1" stroke-linejoin="round"/> <!-- upper mandible -->
      <path d="M412 104 L489 119" stroke="#d9862c" stroke-width="2" stroke-linecap="round"/> <!-- lower mandible edge -->
      <circle cx="406" cy="93" r="6" fill="#f4e8d3"/>
      <circle cx="407" cy="93" r="3.4" fill="#2b2a27"/>
      <circle cx="408.3" cy="91.7" r="1.2" fill="#fff"/>
    </g>

    <!-- Near wing, resting on the handlebar -->
    <path d="M320 152 C358 144 388 164 404 200 L415 208 L407 217 L401 213 L398 221 L391 215 L386 219 L384 208 C372 190 350 178 322 182 C310 176 308 160 320 152 Z"
          fill="url(#feather)" stroke="#d9d0c2" stroke-width="2" stroke-linejoin="round"/>
    <path d="M334 162 C360 158 382 176 396 198 M328 172 C356 170 376 186 392 206" stroke="#e6ded0" stroke-width="1.5" fill="none"/>
  </svg>
  </figure>

  <div class="controls" role="group" aria-label="動畫控制">
    <button id="toggle" type="button" aria-pressed="false">暫停</button>
    <label>速度
      <input id="speed" type="range" min="0.2" max="2.5" step="0.1" value="1" aria-label="騎行速度">
      <span class="val" id="speedVal">1.0×</span>
    </label>
    <span class="hint">空白鍵可暫停或繼續，方向鍵上下可調速，點擊畫面也能暫停。</span>
  </div>
</div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);

  // Geometry (SVG user units). Wheel radius, crank length, gear ratio chainring/cog.
  const WHEEL_R = 55, CRANK = 30, GEAR = 20 / 14;
  const REAR = { x: 250, y: 325 }, FRONT = { x: 430, y: 325 }, BB = { x: 320, y: 336 };
  const HIP_NEAR = { x: 312, y: 214 }, HIP_FAR = { x: 304, y: 214 };
  const THIGH = 66, SHIN = 84;
  const BASE_SPEED = 260;           // px per second at 1×
  const DASH_PERIOD = 64;           // 38 + 26
  const CHAIN_PERIOD = 7;           // 4 + 3

  const el = {
    rearWheel: $('rearWheel'), frontWheel: $('frontWheel'),
    crankNear: $('crankNear'), crankFar: $('crankFar'),
    chainTop: $('chainTop'), chainBottom: $('chainBottom'),
    pedalNear: $('pedalNear'), pedalFar: $('pedalFar'),
    footNear: $('footNear'), footFar: $('footFar'),
    thighNear: $('thighNear'), thighNearO: $('thighNearO'), shinNear: $('shinNear'),
    thighFar: $('thighFar'), thighFarO: $('thighFarO'), shinFar: $('shinFar'),
    riderBody: $('riderBody'), neckHead: $('neckHead'), pouch: $('pouch'),
    cloudsFar: $('cloudsFar'), cloudsNear: $('cloudsNear'),
    hillsFar: $('hillsFar'), hillsMid: $('hillsMid'), trees: $('trees'), verge: $('verge'),
    roadDash: $('roadDash'),
    toggle: $('toggle'), speed: $('speed'), speedVal: $('speedVal'), stage: $('stage')
  };

  let dist = 0;                       // distance travelled, px
  let speedFactor = 1;
  let running = true;
  let last = null;

  // Two-bone IK: returns the knee for a hip→ankle chain, bending forward (+x).
  function solveKnee(hx, hy, tx, ty, a, b) {
    const dx = tx - hx, dy = ty - hy;
    let d = Math.hypot(dx, dy) || 1e-4;
    const ux = dx / d, uy = dy / d;
    d = Math.min(Math.max(d, Math.abs(a - b) + 0.5), a + b - 0.5);
    let cosA = (a * a + d * d - b * b) / (2 * a * d);
    cosA = Math.max(-1, Math.min(1, cosA));
    const s = Math.sqrt(1 - cosA * cosA);
    const k1x = hx + a * (ux * cosA - uy * s), k1y = hy + a * (ux * s + uy * cosA);
    const k2x = hx + a * (ux * cosA + uy * s), k2y = hy + a * (-ux * s + uy * cosA);
    return k1x >= k2x ? [k1x, k1y] : [k2x, k2y];
  }

  function fmt(n) { return n.toFixed(2); }

  function updateLeg(parts, hip, pedal, tilt) {
    const ax = pedal.x - 2, ay = pedal.y - 10.5;          // ankle sits above the pedal
    const [kx, ky] = solveKnee(hip.x, hip.y, ax, ay, THIGH, SHIN);
    const thigh = `M${fmt(hip.x)} ${fmt(hip.y)} L${fmt(kx)} ${fmt(ky)}`;
    parts.thighO.setAttribute('d', thigh);
    parts.thigh.setAttribute('d', thigh);
    parts.shin.setAttribute('d', `M${fmt(kx)} ${fmt(ky)} L${fmt(ax)} ${fmt(ay)}`);
    parts.foot.setAttribute('transform', `translate(${fmt(pedal.x - 2)} ${fmt(pedal.y - 7.5)}) rotate(${fmt(tilt)} 2 7.5)`);
    parts.pedal.setAttribute('transform', `translate(${fmt(pedal.x)} ${fmt(pedal.y)}) rotate(${fmt(tilt)})`);
  }

  const near = { thighO: el.thighNearO, thigh: el.thighNear, shin: el.shinNear, foot: el.footNear, pedal: el.pedalNear };
  const far  = { thighO: el.thighFarO,  thigh: el.thighFar,  shin: el.shinFar,  foot: el.footFar,  pedal: el.pedalFar };

  function render() {
    const wa = dist / WHEEL_R;                 // wheel angle, rad (clockwise on screen = forward)
    const ca = wa / GEAR;                      // crank angle, rad
    const wdeg = wa * 180 / Math.PI, cdeg = ca * 180 / Math.PI;

    el.rearWheel.setAttribute('transform', `translate(${REAR.x} ${REAR.y}) rotate(${fmt(wdeg)})`);
    el.frontWheel.setAttribute('transform', `translate(${FRONT.x} ${FRONT.y}) rotate(${fmt(wdeg)})`);
    el.crankNear.setAttribute('transform', `translate(${BB.x} ${BB.y}) rotate(${fmt(cdeg)})`);
    el.crankFar.setAttribute('transform', `translate(${BB.x} ${BB.y}) rotate(${fmt(cdeg)})`);

    const chainOffset = -((ca * 20) % CHAIN_PERIOD);
    el.chainTop.style.strokeDashoffset = chainOffset;
    el.chainBottom.style.strokeDashoffset = chainOffset;

    // Body bob: two per crank revolution, head lags slightly, pouch swings later still.
    const bob = 1.8 * Math.sin(2 * ca);
    const neckBob = 1.3 * Math.sin(2 * ca - 0.9);
    const neckRot = 1.6 * Math.sin(2 * ca - 1.2);
    el.riderBody.setAttribute('transform', `translate(0 ${fmt(bob)})`);
    el.neckHead.setAttribute('transform', `translate(0 ${fmt(bob + neckBob)}) rotate(${fmt(neckRot)} 328 156)`);
    const w = 5 * Math.sin(2 * ca - 1.5);
    el.pouch.setAttribute('d', `M412 104 Q448 ${fmt(152 + w)} 489 119 Z`);

    // Pedals and legs
    const cos = Math.cos(ca), sin = Math.sin(ca);
    const pNear = { x: BB.x + CRANK * cos, y: BB.y + CRANK * sin };
    const pFar  = { x: BB.x - CRANK * cos, y: BB.y - CRANK * sin };
    updateLeg(near, { x: HIP_NEAR.x, y: HIP_NEAR.y + bob }, pNear, -6 * sin);
    updateLeg(far,  { x: HIP_FAR.x,  y: HIP_FAR.y  + bob }, pFar,   6 * sin);

    // Parallax scrolling (each layer is drawn twice, 800 apart)
    const wrap = (k) => `translate(${fmt(-((dist * k) % 800))} 0)`;
    el.cloudsFar.setAttribute('transform', wrap(0.035));
    el.hillsFar.setAttribute('transform', wrap(0.06));
    el.cloudsNear.setAttribute('transform', wrap(0.09));
    el.hillsMid.setAttribute('transform', wrap(0.14));
    el.trees.setAttribute('transform', wrap(0.3));
    el.verge.setAttribute('transform', wrap(1));
    el.roadDash.style.strokeDashoffset = dist % DASH_PERIOD;
  }

  function frame(ts) {
    if (last === null) last = ts;
    const dt = Math.min((ts - last) / 1000, 0.05);   // clamp after tab switches
    last = ts;
    if (running) dist += BASE_SPEED * speedFactor * dt;
    render();
    requestAnimationFrame(frame);
  }

  function setRunning(state) {
    running = state;
    el.toggle.textContent = running ? '暫停' : '繼續';
    el.toggle.setAttribute('aria-pressed', String(!running));
  }
  function setSpeed(v) {
    speedFactor = Math.min(2.5, Math.max(0.2, Math.round(v * 10) / 10));
    el.speed.value = speedFactor;
    el.speedVal.textContent = speedFactor.toFixed(1) + '×';
  }

  el.toggle.addEventListener('click', () => setRunning(!running));
  el.speed.addEventListener('input', () => setSpeed(parseFloat(el.speed.value)));
  el.stage.addEventListener('click', () => setRunning(!running));
  document.addEventListener('keydown', (e) => {
    if (e.target === el.speed) return;
    if (e.code === 'Space') { e.preventDefault(); setRunning(!running); }
    else if (e.code === 'ArrowUp') { e.preventDefault(); setSpeed(speedFactor + 0.1); }
    else if (e.code === 'ArrowDown') { e.preventDefault(); setSpeed(speedFactor - 0.1); }
  });

  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    setRunning(false);
  }
  render();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
