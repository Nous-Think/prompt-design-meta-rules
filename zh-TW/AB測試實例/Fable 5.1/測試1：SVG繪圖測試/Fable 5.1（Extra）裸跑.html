<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fable 5.1（Extra）裸跑：鵜鶘騎自行車</title>
<style>
  :root {
    --deep: #0e3c47;
    --cream: #fbf6ea;
    --sand: #e9d3a0;
    --teal: #1f7a86;
    --orange: #ef9a3b;
    --pouch: #f2905a;
    --ink: #2b2a30;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--deep);
    color: var(--cream);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    display: grid;
    place-content: center;
    gap: 14px;
    padding: 28px 20px;
  }
  header {
    width: min(100%, 1040px);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
  }
  h1 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 500;
    letter-spacing: .08em;
  }
  button {
    font: inherit;
    font-size: .9rem;
    letter-spacing: .06em;
    color: var(--cream);
    background: transparent;
    border: 1px solid rgba(251, 246, 234, .45);
    border-radius: 999px;
    padding: 6px 16px;
    cursor: pointer;
  }
  button:hover { border-color: var(--cream); }
  button:focus-visible { outline: 2px solid #ffe28a; outline-offset: 3px; }
  .stage {
    width: min(100%, 1040px);
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 30px 50px -24px rgba(0, 0, 0, .7);
  }
  svg { display: block; width: 100%; height: 100%; }
  p.note {
    margin: 0;
    font-size: .8rem;
    opacity: .6;
    width: min(100%, 1040px);
  }
</style>
</head>
<body>

<header>
  <h1>鵜鶘的海岸線通勤</h1>
  <button id="toggle" type="button" aria-pressed="false">暫停</button>
</header>

<div class="stage">
<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">鵜鶘騎自行車</title>
  <desc id="svgDesc">一隻白鵜鶘沿著海岸公路踩著青綠色自行車，喙袋裡還叼著一條魚，背景是海浪、沙丘與低垂的太陽。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86c6dc"/>
      <stop offset=".62" stop-color="#d6e8ec"/>
      <stop offset="1" stop-color="#f7ddb2"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#45a6b5"/>
      <stop offset="1" stop-color="#1d6f7d"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff1bd" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff1bd" stop-opacity="0"/>
    </radialGradient>

    <g id="cloud" fill="#ffffff" fill-opacity=".85">
      <ellipse cx="0" cy="0" rx="50" ry="15"/>
      <circle cx="-16" cy="-10" r="17"/>
      <circle cx="12" cy="-15" r="22"/>
      <circle cx="30" cy="-6" r="14"/>
    </g>

    <path id="dune" fill="#e9d3a0"
      d="M0,388 C100,372 200,398 320,382 C440,366 520,400 640,384 C760,368 860,398 960,380 C1040,368 1100,404 1200,388 L1200,480 L0,480 Z"/>

    <g id="tuft" stroke="#a7a06a" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M0,0 C-2,-8 -8,-12 -10,-16"/>
      <path d="M0,0 C1,-9 -1,-14 -2,-20"/>
      <path d="M0,0 C3,-7 8,-10 11,-14"/>
      <path d="M0,0 C4,-4 9,-5 14,-6"/>
    </g>
  </defs>

  <!-- sky & sun -->
  <rect width="960" height="540" fill="url(#sky)"/>
  <circle cx="742" cy="222" r="120" fill="url(#glow)"/>
  <circle cx="742" cy="222" r="44" fill="#ffe28a"/>

  <!-- clouds (pattern width 1920) -->
  <g id="clouds">
    <use href="#cloud" x="150" y="96"/>
    <use href="#cloud" x="520" y="60" transform="scale(.8)" />
    <use href="#cloud" x="1010" y="130"/>
    <use href="#cloud" x="1480" y="80" transform="scale(.9)"/>
    <use href="#cloud" x="2070" y="96"/>
    <use href="#cloud" x="2440" y="60" transform="scale(.8)"/>
    <use href="#cloud" x="2930" y="130"/>
  </g>

  <!-- sea -->
  <rect y="300" width="960" height="100" fill="url(#sea)"/>
  <line x1="0" y1="300.5" x2="960" y2="300.5" stroke="#ffffff" stroke-opacity=".55"/>
  <g id="waves" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></g>

  <!-- dunes (pattern width 1200) -->
  <g id="dunes">
    <use href="#dune"/>
    <use href="#dune" x="1200"/>
  </g>

  <!-- road -->
  <rect y="470" width="960" height="70" fill="#5b5760"/>
  <line x1="0" y1="471" x2="960" y2="471" stroke="#f3e5c3" stroke-opacity=".45" stroke-width="2"/>
  <g id="dashes">
    <line x1="0" y1="510" x2="1200" y2="510" stroke="#f3d27c" stroke-width="5" stroke-dasharray="70 50"/>
  </g>

  <!-- road shoulder: bollards & grass (pattern width 1200) -->
  <g id="shoulder"></g>

  <!-- ================= pelican & bicycle rig ================= -->
  <g id="rig" transform="translate(350,420)">

    <!-- far leg -->
    <polyline id="legFar" points="" fill="none" stroke="#c97d2c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="footFar"><path d="M-9,-3 L12,-9 L15,-5 L10,-2 L16,0 L10,2 L15,5 L12,9 L-9,3 Z" fill="#c97d2c"/></g>
    <line id="crankFar" x1="85" y1="-8" x2="85" y2="-8" stroke="#4b4a52" stroke-width="5" stroke-linecap="round"/>
    <g id="pedalFar"><rect x="-11" y="-3" width="22" height="6" rx="2" fill="#4b4a52"/></g>

    <!-- wheels -->
    <g transform="translate(0,0)">
      <circle r="60" fill="none" stroke="var(--ink)" stroke-width="11"/>
      <circle r="52" fill="none" stroke="#e6e6e6" stroke-width="3"/>
      <g id="spokesRear" stroke="#dcdcdc" stroke-width="1.6">
        <line y2="-51"/><line y2="-51" transform="rotate(45)"/><line y2="-51" transform="rotate(90)"/><line y2="-51" transform="rotate(135)"/>
        <line y2="-51" transform="rotate(180)"/><line y2="-51" transform="rotate(225)"/><line y2="-51" transform="rotate(270)"/><line y2="-51" transform="rotate(315)"/>
      </g>
      <circle r="7" fill="#e6e6e6" stroke="var(--ink)" stroke-width="3"/>
    </g>
    <g transform="translate(200,0)">
      <circle r="60" fill="none" stroke="var(--ink)" stroke-width="11"/>
      <circle r="52" fill="none" stroke="#e6e6e6" stroke-width="3"/>
      <g id="spokesFront" stroke="#dcdcdc" stroke-width="1.6">
        <line y2="-51"/><line y2="-51" transform="rotate(45)"/><line y2="-51" transform="rotate(90)"/><line y2="-51" transform="rotate(135)"/>
        <line y2="-51" transform="rotate(180)"/><line y2="-51" transform="rotate(225)"/><line y2="-51" transform="rotate(270)"/><line y2="-51" transform="rotate(315)"/>
      </g>
      <circle r="7" fill="#e6e6e6" stroke="var(--ink)" stroke-width="3"/>
    </g>

    <!-- frame -->
    <g fill="none" stroke="var(--teal)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0,0 L85,-8 L52,-128 L0,0"/>
      <path d="M52,-128 L170,-128"/>
      <path d="M178,-104 L85,-8"/>
      <path d="M169,-134 L183,-98" stroke-width="10"/>
      <path d="M183,-98 L200,0"/>
      <path d="M52,-128 L52,-144"/>
      <path d="M168,-136 L160,-168"/>
      <path d="M160,-168 C176,-194 160,-204 144,-196"/>
    </g>
    <circle cx="144" cy="-196" r="5.5" fill="var(--ink)"/>
    <path d="M14,-146 C34,-156 68,-152 86,-142 C70,-134 34,-134 14,-146 Z" fill="#4a2f23"/>

    <!-- drivetrain -->
    <g fill="none" stroke="#3a3940" stroke-width="2.5">
      <line x1="0" y1="-9" x2="85" y2="-30"/>
      <line x1="0" y1="9" x2="85" y2="14"/>
    </g>
    <circle cx="85" cy="-8" r="22" fill="none" stroke="#3a3940" stroke-width="4"/>
    <circle r="9" fill="none" stroke="#3a3940" stroke-width="3"/>
    <line id="crankNear" x1="85" y1="-8" x2="85" y2="-8" stroke="#3a3940" stroke-width="5" stroke-linecap="round"/>
    <g id="pedalNear"><rect x="-11" y="-3" width="22" height="6" rx="2" fill="var(--ink)"/></g>

    <!-- pelican body (bobs) -->
    <g id="pelican">
      <!-- tail -->
      <path d="M44,-160 L0,-192 L18,-166 Z" fill="#e4dccb"/>
      <path d="M6,-188 L0,-192 L9,-179 Z" fill="#4f4f4f"/>
      <path d="M44,-162 L6,-180 L26,-156 Z" fill="var(--cream)"/>

      <!-- neck (behind body) -->
      <path d="M112,-204 C146,-214 136,-258 166,-278" fill="none" stroke="var(--cream)" stroke-width="26" stroke-linecap="round"/>

      <!-- body -->
      <ellipse cx="80" cy="-182" rx="52" ry="40" transform="rotate(-20 80 -182)" fill="var(--cream)"/>
      <ellipse cx="76" cy="-166" rx="36" ry="14" transform="rotate(-20 76 -166)" fill="#e4dccb" opacity=".55"/>

      <!-- head -->
      <path d="M160,-303 C154,-318 168,-318 171,-306 Z" fill="var(--cream)"/>
      <circle cx="178" cy="-286" r="23" fill="var(--cream)"/>
      <circle cx="188" cy="-292" r="8" fill="#f3dc9a"/>
      <g id="eye">
        <circle cx="189" cy="-292" r="4.2" fill="#222"/>
        <circle cx="187.6" cy="-293.6" r="1.4" fill="#fff"/>
      </g>

      <!-- fish (head hidden inside the pouch, tail poking out) -->
      <g id="fish" transform="translate(304,-262)">
        <path d="M-12,0 L24,-12 L17,0 L24,12 Z" fill="#5f9fb3"/>
      </g>

      <!-- pouch (wobbles) -->
      <path id="pouch" d="M197,-281 C205,-246 252,-230 292,-250 C306,-257 314,-260 316,-263 Z" fill="var(--pouch)"/>

      <!-- upper mandible -->
      <path d="M195,-299 C240,-297 292,-283 320,-268 C325,-265 322,-259 316,-262 L197,-282 Z" fill="#f0a63a"/>
      <path d="M200,-290 L310,-269" fill="none" stroke="#c9822a" stroke-width="1.5" opacity=".6"/>

      <!-- near wing, reaching forward to the handlebar -->
      <path d="M84,-214 C110,-240 158,-232 168,-206 C174,-192 160,-182 144,-192 C124,-204 100,-206 84,-214 Z" fill="#e8dfc8"/>
      <path d="M168,-206 C178,-196 170,-180 146,-190 C158,-192 165,-198 168,-206 Z" fill="#5a5a5a"/>
      <path d="M96,-214 C120,-228 150,-224 162,-206" fill="none" stroke="#d8cdb5" stroke-width="2"/>
      <path d="M104,-208 C126,-218 148,-214 158,-200" fill="none" stroke="#d8cdb5" stroke-width="1.5"/>
    </g>

    <!-- near leg -->
    <polyline id="legNear" points="" fill="none" stroke="var(--orange)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="footNear"><path d="M-9,-3 L12,-9 L15,-5 L10,-2 L16,0 L10,2 L15,5 L12,9 L-9,3 Z" fill="var(--orange)"/></g>
  </g>
</svg>
</div>

<p class="note">踩踏、車輪、喙袋與背景的捲動都由同一個時鐘驅動；若系統設定為減少動態效果，畫面會停在靜止的一格。</p>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2;

  // ---------- rig constants (local coords of #rig) ----------
  const CRANK = { x: 85, y: -8 };
  const PEDAL_R = 26;
  const HIP = { x: 58, y: -138 };
  const THIGH = 80, SHIN = 80;
  const CRANK_PERIOD = 1.4;   // s per pedal revolution
  const WHEEL_PERIOD = 1.1;   // s per wheel revolution
  const GROUND_SPEED = 260;   // px/s

  // ---------- build repeating scenery ----------
  const waves = $('waves');
  [[322, .35, 0], [346, .28, 60], [372, .22, 120]].forEach(([y, op, off]) => {
    let d = `M${-240 + off},${y}`;
    for (let x = -240 + off; x < 1300; x += 60) d += ` q30,-7 60,0`;
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    p.setAttribute('stroke-opacity', op);
    waves.appendChild(p);
  });

  const shoulder = $('shoulder');
  const NS = 'http://www.w3.org/2000/svg';
  for (let x = 40; x < 2400; x += 240) {
    const post = document.createElementNS(NS, 'rect');
    post.setAttribute('x', x - 3); post.setAttribute('y', 448);
    post.setAttribute('width', 6); post.setAttribute('height', 22);
    post.setAttribute('rx', 1.5); post.setAttribute('fill', '#f6f1e3');
    shoulder.appendChild(post);
    const cap = document.createElementNS(NS, 'rect');
    cap.setAttribute('x', x - 3); cap.setAttribute('y', 448);
    cap.setAttribute('width', 6); cap.setAttribute('height', 5);
    cap.setAttribute('fill', '#d94f3d');
    shoulder.appendChild(cap);
  }
  for (let x = 110; x < 2400; x += 80) {
    const u = document.createElementNS(NS, 'use');
    u.setAttribute('href', '#tuft');
    u.setAttribute('x', x + ((x * 7) % 37) - 18);
    u.setAttribute('y', 470 - ((x * 3) % 9));
    shoulder.appendChild(u);
  }

  const layers = [
    { el: $('clouds'),   speed: 12,           width: 1920 },
    { el: $('waves'),    speed: 28,           width: 240  },
    { el: $('dunes'),    speed: 55,           width: 1200 },
    { el: $('shoulder'), speed: GROUND_SPEED, width: 1200 },
    { el: $('dashes'),   speed: GROUND_SPEED, width: 120  },
  ];

  // ---------- rig references ----------
  const spokes = [$('spokesRear'), $('spokesFront')];
  const pelican = $('pelican');
  const pouch = $('pouch');
  const fish = $('fish');
  const eye = $('eye');
  const legs = [
    { line: $('legNear'), foot: $('footNear'), crank: $('crankNear'), pedal: $('pedalNear'), phase: 0 },
    { line: $('legFar'),  foot: $('footFar'),  crank: $('crankFar'),  pedal: $('pedalFar'),  phase: Math.PI },
  ];

  // two-bone IK: knee bends forward (toward +x)
  function solveLeg(hip, foot) {
    let dx = foot.x - hip.x, dy = foot.y - hip.y;
    let d = Math.hypot(dx, dy);
    const max = THIGH + SHIN - 0.5;
    if (d > max) { dx *= max / d; dy *= max / d; d = max; }
    const a = (THIGH * THIGH - SHIN * SHIN + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, THIGH * THIGH - a * a));
    const ux = dx / d, uy = dy / d;
    return {
      knee: { x: hip.x + ux * a + uy * h, y: hip.y + uy * a - ux * h },
      foot: { x: hip.x + dx, y: hip.y + dy }
    };
  }

  function render(t) {
    const crankA = (t / CRANK_PERIOD) * TAU;
    const wheelDeg = (t / WHEEL_PERIOD) * 360;
    spokes.forEach(s => s.setAttribute('transform', `rotate(${wheelDeg})`));

    const bob = Math.sin(crankA * 2) * 2.5;
    pelican.setAttribute('transform', `translate(0,${bob})`);

    const hip = { x: HIP.x, y: HIP.y + bob };
    legs.forEach(l => {
      const a = crankA + l.phase;
      const p = { x: CRANK.x + Math.cos(a) * PEDAL_R, y: CRANK.y + Math.sin(a) * PEDAL_R };
      const ik = solveLeg(hip, p);
      l.line.setAttribute('points', `${hip.x},${hip.y} ${ik.knee.x},${ik.knee.y} ${ik.foot.x},${ik.foot.y}`);
      l.foot.setAttribute('transform', `translate(${ik.foot.x},${ik.foot.y - 4}) rotate(${Math.sin(a) * 8})`);
      l.crank.setAttribute('x2', p.x); l.crank.setAttribute('y2', p.y);
      l.pedal.setAttribute('transform', `translate(${p.x},${p.y})`);
    });

    pouch.setAttribute('transform', `rotate(${Math.sin(crankA * 2 - 0.9) * 3.5} 197 -281)`);
    fish.setAttribute('transform', `translate(304,-262) rotate(${18 + Math.sin(t * 9) * 12})`);

    const blink = (t % 4.3) < 0.13 ? 0.1 : 1;
    eye.setAttribute('transform', `translate(189,-292) scale(1,${blink}) translate(-189,292)`);

    layers.forEach(L => {
      const x = -((t * L.speed) % L.width);
      L.el.setAttribute('transform', `translate(${x},0)`);
    });
  }

  // ---------- clock ----------
  const btn = $('toggle');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playing = !reduce;
  let t = 0.35, last = null;

  function setLabel() {
    btn.textContent = playing ? '暫停' : '播放';
    btn.setAttribute('aria-pressed', String(!playing));
  }
  btn.addEventListener('click', () => { playing = !playing; last = null; setLabel(); });
  setLabel();

  function frame(now) {
    if (last === null) last = now;
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (playing) { t += dt; render(t); }
    requestAnimationFrame(frame);
  }
  render(t);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
