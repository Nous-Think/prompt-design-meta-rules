<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fable 5.1（High）裸跑：鵜鶘騎自行車</title>
<style>
  :root {
    --sky: #d7ecf3;
    --sky-deep: #a9d3e3;
    --sea: #3f8fa0;
    --sea-deep: #2c6f7f;
    --foam: #e8f6f8;
    --sand: #e3c48f;
    --sand-line: #c9a468;
    --sun: #ffd977;
    --feather: #f6f2e7;
    --feather-shade: #d9d3c3;
    --wing: #b7b1a3;
    --bill: #f0a03c;
    --pouch: #e0783f;
    --leg: #f2b24c;
    --bike: #c8483a;
    --bike-dark: #8f3227;
    --tire: #2d2a28;
    --rim: #e5e1d8;
    --ink: #2d2a28;
    --spin: 0.62s;
    --pedal: 1.24s;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--sand);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  figure {
    margin: 0;
    width: min(960px, 100%);
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 18px;
    box-shadow: 0 18px 40px rgba(45, 42, 40, .18);
  }
  figcaption {
    margin-top: 14px;
    font-size: 15px;
    line-height: 1.6;
    text-align: center;
    color: #5a5147;
  }

  /* ---- motion ---- */
  .wheel-spin {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin var(--spin) linear infinite;
  }
  .crank {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin var(--pedal) linear infinite;
  }
  .pedal-level {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin var(--pedal) linear infinite reverse;
  }
  .rider {
    animation: bob var(--pedal) ease-in-out infinite;
  }
  .bike-frame {
    animation: bob-half var(--pedal) ease-in-out infinite;
  }
  .pouch {
    transform-box: fill-box;
    transform-origin: 0% 0%;
    animation: jiggle var(--pedal) ease-in-out infinite;
  }
  .tuft {
    transform-box: fill-box;
    transform-origin: 0% 100%;
    animation: flutter 0.9s ease-in-out infinite alternate;
  }
  .planks   { animation: scroll-x 1.4s linear infinite; }
  .waves    { animation: scroll-x 6s linear infinite; }
  .clouds   { animation: scroll-x 40s linear infinite; }
  .horizon  { animation: scroll-x 90s linear infinite; }

  @keyframes spin   { to { transform: rotate(360deg); } }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-2.5px); }
  }
  @keyframes bob-half {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-1px); }
  }
  @keyframes jiggle {
    0%, 100% { transform: rotate(0deg) scaleY(1); }
    50%      { transform: rotate(1.6deg) scaleY(1.06); }
  }
  @keyframes flutter {
    from { transform: rotate(-6deg); }
    to   { transform: rotate(10deg); }
  }
  @keyframes scroll-x {
    from { transform: translateX(0); }
    to   { transform: translateX(-240px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .wheel-spin, .crank, .pedal-level, .rider, .bike-frame,
    .pouch, .tuft, .planks, .waves, .clouds, .horizon {
      animation: none;
    }
  }
</style>
</head>
<body>
<figure>
<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">一隻鵜鶘沿著海邊木棧道騎自行車</title>
  <desc id="d">2D 動畫：車輪與踏板轉動，鵜鶘雙腿跟著踩踏，背景的海浪與木板向左捲動。</desc>

  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--sky)"/>
      <stop offset="1" stop-color="var(--sky-deep)"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--sea)"/>
      <stop offset="1" stop-color="var(--sea-deep)"/>
    </linearGradient>
    <clipPath id="frame"><rect width="960" height="480"/></clipPath>

    <!-- one wheel, reused twice -->
    <g id="wheel">
      <circle r="60" fill="none" stroke="var(--tire)" stroke-width="9"/>
      <circle r="52" fill="none" stroke="var(--rim)" stroke-width="4"/>
      <g class="wheel-spin" stroke="var(--rim)" stroke-width="2.2" stroke-linecap="round">
        <line x1="0" y1="-50" x2="0" y2="50"/>
        <line x1="-50" y1="0" x2="50" y2="0"/>
        <line x1="-35.4" y1="-35.4" x2="35.4" y2="35.4"/>
        <line x1="35.4" y1="-35.4" x2="-35.4" y2="35.4"/>
        <line x1="-19.1" y1="-46.2" x2="19.1" y2="46.2"/>
        <line x1="19.1" y1="-46.2" x2="-19.1" y2="46.2"/>
        <line x1="-46.2" y1="-19.1" x2="46.2" y2="19.1"/>
        <line x1="46.2" y1="-19.1" x2="-46.2" y2="19.1"/>
        <circle r="7" fill="var(--tire)"/>
      </g>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <!-- sky -->
    <rect width="960" height="480" fill="url(#skyGrad)"/>
    <circle cx="760" cy="96" r="44" fill="var(--sun)"/>

    <!-- clouds (pattern repeats every 240px so the loop is seamless) -->
    <g class="clouds" fill="#ffffff" opacity=".85">
      <g id="cloud">
        <ellipse cx="90" cy="120" rx="46" ry="16"/>
        <ellipse cx="72" cy="110" rx="24" ry="17"/>
        <ellipse cx="108" cy="106" rx="30" ry="20"/>
        <ellipse cx="220" cy="170" rx="30" ry="10"/>
        <ellipse cx="228" cy="162" rx="16" ry="11"/>
      </g>
      <use href="#cloud" x="240"/><use href="#cloud" x="480"/>
      <use href="#cloud" x="720"/><use href="#cloud" x="960"/>
    </g>

    <!-- distant headland -->
    <g class="horizon" fill="#8fc0cf">
      <g id="hill">
        <path d="M0 250 Q60 236 120 246 T240 250 Z"/>
      </g>
      <use href="#hill" x="240"/><use href="#hill" x="480"/>
      <use href="#hill" x="720"/><use href="#hill" x="960"/>
    </g>

    <!-- sea -->
    <rect y="250" width="960" height="160" fill="url(#seaGrad)"/>
    <g class="waves" fill="none" stroke="var(--foam)" stroke-width="3" stroke-linecap="round" opacity=".8">
      <g id="wave">
        <path d="M10 300 q20 -8 40 0 t40 0"/>
        <path d="M150 340 q20 -8 40 0 t40 0"/>
        <path d="M70 380 q20 -8 40 0 t40 0"/>
        <path d="M200 275 q14 -6 28 0"/>
      </g>
      <use href="#wave" x="240"/><use href="#wave" x="480"/>
      <use href="#wave" x="720"/><use href="#wave" x="960"/>
    </g>

    <!-- boardwalk -->
    <rect y="405" width="960" height="14" fill="var(--sand-line)"/>
    <rect y="419" width="960" height="61" fill="var(--sand)"/>
    <g class="planks" stroke="var(--sand-line)" stroke-width="3">
      <g id="plank">
        <line x1="0" y1="419" x2="0" y2="480"/>
        <line x1="60" y1="419" x2="60" y2="480"/>
        <line x1="120" y1="419" x2="120" y2="480"/>
        <line x1="180" y1="419" x2="180" y2="480"/>
      </g>
      <use href="#plank" x="240"/><use href="#plank" x="480"/>
      <use href="#plank" x="720"/><use href="#plank" x="960"/>
    </g>
    <!-- shadow on the deck -->
    <ellipse cx="480" cy="424" rx="200" ry="7" fill="rgba(45,42,40,.16)"/>

    <!-- ================= bike + pelican ================= -->
    <g transform="translate(280 60)">

      <!-- far leg sits behind the frame -->
      <g class="rider">
        <path fill="none" stroke="#d99a3d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
          <animate attributeName="d" dur="1.24s" repeatCount="indefinite" calcMode="linear"
            values="M163,214 L199.8,258.8 L159.0,300.0;M163,214 L203.7,255.3 L159.9,293.3;M163,214 L207.8,250.8 L162.5,287.0;M163,214 L211.8,245.3 L166.6,281.6;M163,214 L215.4,239.0 L172.0,277.5;M163,214 L217.9,232.6 L178.3,274.9;M163,214 L219.4,227.3 L185.0,274.0;M163,214 L220.1,224.3 L191.7,274.9;M163,214 L220.2,223.9 L198.0,277.5;M163,214 L219.8,226.0 L203.4,281.6;M163,214 L218.7,230.1 L207.5,287.0;M163,214 L216.8,235.7 L210.1,293.3;M163,214 L213.8,242.1 L211.0,300.0;M163,214 L209.5,248.7 L210.1,306.7;M163,214 L203.9,255.1 L207.5,313.0;M163,214 L197.4,260.7 L203.4,318.4;M163,214 L190.7,265.0 L198.0,322.5;M163,214 L185.5,267.4 L191.7,325.1;M163,214 L184.2,268.0 L185.0,326.0;M163,214 L185.3,267.5 L178.3,325.1;M163,214 L187.4,266.6 L172.0,322.5;M163,214 L190.0,265.3 L166.6,318.4;M163,214 L193.0,263.7 L162.5,313.0;M163,214 L196.2,261.5 L159.9,306.7;M163,214 L199.8,258.8 L159.0,300.0"/>
        </path>
      </g>

      <!-- wheels -->
      <use href="#wheel" x="100" y="300"/>
      <use href="#wheel" x="300" y="300"/>

      <!-- frame -->
      <g class="bike-frame" fill="none" stroke="var(--bike)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M100 300 L185 300 L155 198 L100 300"/>       <!-- rear triangle -->
        <path d="M155 198 L270 196 L185 300"/>                <!-- top tube + down tube -->
        <path d="M270 196 L300 300"/>                          <!-- fork -->
        <path d="M270 196 L278 176" stroke-width="7"/>         <!-- head tube -->
        <path d="M155 198 L150 180" stroke-width="6"/>         <!-- seat post -->
        <!-- handlebar -->
        <path d="M278 176 q-8 -10 -20 -6 M278 176 q10 -8 22 0" stroke="var(--tire)" stroke-width="7"/>
        <!-- saddle -->
        <path d="M132 178 q18 -8 36 0 q-4 6 -18 6 q-14 0 -18 -6 z" fill="var(--tire)" stroke="none"/>
        <!-- chainring + chain -->
        <circle cx="185" cy="300" r="17" fill="none" stroke="var(--bike-dark)" stroke-width="4"/>
        <path d="M185 283 L100 293 M185 317 L100 307" stroke="var(--tire)" stroke-width="2.5"/>
      </g>

      <!-- crank arms and level pedals -->
      <g class="crank">
        <circle cx="185" cy="300" r="26" fill="none" stroke="none"/> <!-- sizing helper for fill-box -->
        <path d="M159 300 L211 300" stroke="var(--tire)" stroke-width="6" stroke-linecap="round"/>
        <g class="pedal-level">
          <circle cx="211" cy="300" r="9" fill="none"/>
          <rect x="202" y="297" width="18" height="6" rx="2" fill="var(--tire)"/>
          <!-- webbed foot -->
          <path d="M203 297 l4 -7 l6 3 l7 -2 l-2 6 z" fill="var(--leg)"/>
        </g>
        <g class="pedal-level">
          <circle cx="159" cy="300" r="9" fill="none"/>
          <rect x="150" y="297" width="18" height="6" rx="2" fill="var(--tire)"/>
          <path d="M151 297 l4 -7 l6 3 l7 -2 l-2 6 z" fill="#d99a3d"/>
        </g>
      </g>

      <!-- pelican -->
      <g class="rider">
        <!-- tail -->
        <path d="M128 208 l-30 -10 l6 12 l-8 10 l30 -4 z" fill="var(--feather-shade)"/>
        <!-- body -->
        <ellipse cx="170" cy="198" rx="50" ry="30" fill="var(--feather)" transform="rotate(-8 170 198)"/>
        <!-- folded wing -->
        <path d="M150 178 q40 -22 80 -6 q-20 22 -52 26 q-22 1 -28 -20 z" fill="var(--wing)"/>
        <!-- wing tip resting on handlebar -->
        <path d="M205 180 q40 -20 72 -8" fill="none" stroke="var(--wing)" stroke-width="12" stroke-linecap="round"/>
        <!-- neck -->
        <path d="M205 186 q30 -6 34 -40 q4 -32 -6 -56" fill="none" stroke="var(--feather)" stroke-width="22" stroke-linecap="round"/>
        <path d="M206 186 q30 -6 34 -40 q4 -32 -6 -56" fill="none" stroke="var(--feather-shade)" stroke-width="4" stroke-linecap="round" opacity=".6"/>
        <!-- head -->
        <circle cx="238" cy="92" r="20" fill="var(--feather)"/>
        <g class="tuft">
          <path d="M228 74 q2 -12 12 -14 q-2 8 4 12" fill="var(--feather-shade)"/>
        </g>
        <!-- near leg (in front of frame) -->
        <path fill="none" stroke="var(--leg)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
          <animate attributeName="d" dur="1.24s" repeatCount="indefinite" calcMode="linear"
            values="M163,214 L213.8,242.1 L211.0,300.0;M163,214 L209.5,248.7 L210.1,306.7;M163,214 L203.9,255.1 L207.5,313.0;M163,214 L197.4,260.7 L203.4,318.4;M163,214 L190.7,265.0 L198.0,322.5;M163,214 L185.5,267.4 L191.7,325.1;M163,214 L184.2,268.0 L185.0,326.0;M163,214 L185.3,267.5 L178.3,325.1;M163,214 L187.4,266.6 L172.0,322.5;M163,214 L190.0,265.3 L166.6,318.4;M163,214 L193.0,263.7 L162.5,313.0;M163,214 L196.2,261.5 L159.9,306.7;M163,214 L199.8,258.8 L159.0,300.0;M163,214 L203.7,255.3 L159.9,293.3;M163,214 L207.8,250.8 L162.5,287.0;M163,214 L211.8,245.3 L166.6,281.6;M163,214 L215.4,239.0 L172.0,277.5;M163,214 L217.9,232.6 L178.3,274.9;M163,214 L219.4,227.3 L185.0,274.0;M163,214 L220.1,224.3 L191.7,274.9;M163,214 L220.2,223.9 L198.0,277.5;M163,214 L219.8,226.0 L203.4,281.6;M163,214 L218.7,230.1 L207.5,287.0;M163,214 L216.8,235.7 L210.1,293.3;M163,214 L213.8,242.1 L211.0,300.0"/>
        </path>
        <!-- bill: pouch first, upper mandible on top -->
        <g class="pouch">
          <path d="M252 96 q40 6 80 18 q-4 22 -36 18 q-30 -4 -44 -30 z" fill="var(--pouch)"/>
        </g>
        <path d="M250 90 L336 112 q-2 6 -8 6 L250 100 z" fill="var(--bill)"/>
        <path d="M250 90 L336 112" fill="none" stroke="var(--bike-dark)" stroke-width="1.5" opacity=".5"/>
        <!-- eye -->
        <circle cx="244" cy="88" r="4.2" fill="var(--ink)"/>
        <circle cx="245.5" cy="86.5" r="1.4" fill="#fff"/>
      </g>
    </g>
  </g>
</svg>
<figcaption>海風、木棧道，和一隻不太趕時間的鵜鶘。</figcaption>
</figure>
</body>
</html>
